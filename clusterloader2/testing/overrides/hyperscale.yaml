CL2_ENABLE_CONTAINER_RESOURCES_MEASUREMENT: true
CL2_PROMETHEUS_TOLERATE_MASTER: true
CL2_PROMETHEUS_MEMORY_LIMIT_FACTOR: 1.0
CL2_PROMETHEUS_MEMORY_SCALE_FACTOR: 1.0
CL2_PROMETHEUS_CPU_SCALE_FACTOR: 1.0
CL2_PROMETHEUS_NODE_SELECTOR: "prometheus: \"true\""
PROMETHEUS_PVC_STORAGE_CLASS: managed

NODES: 8000
PODS_PER_NODE: 16 # 128000 pods

BIG_GROUP_SIZE: 5
MEDIUM_GROUP_SIZE: 2
SMALL_GROUP_SIZE: 1

SMALL_STATEFUL_SETS_PER_NAMESPACE: 0
MEDIUM_STATEFUL_SETS_PER_NAMESPACE: 0

CL2_RATE_LIMIT_POD_CREATION: false
CL2_LOAD_TEST_THROUGHPUT: 500
RANDOM_SCALE_FACTOR: 0
CL2_DELETE_TEST_THROUGHPUT: 500
CL2_ENABLE_PVS: false