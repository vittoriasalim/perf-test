NODES: 10 # 5000
PODS_PER_NODE: 16
BIG_GROUP_SIZE: 3
SMALL_GROUP_SIZE: 3 
MEDIUM_GROUP_SIZE: 3
SMALL_STATEFUL_SETS_PER_NAMESPACE: 0
MEDIUM_STATEFUL_SETS_PER_NAMESPACE: 0 
LOAD_TEST_THROUGHPUT: 50