# Module for collecting API server concurrency metrics with histograms
{{$action := .action}} # start, gather


steps:
- name: "{{$action}}ing API server concurrency measurements"
  measurements:
  - Identifier: APIServerInflights
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: "APIServerConcurrency"
      metricVersion: v1
      unit: req
      queries:
        - name: inflight_1m_p50
          query: "quantile_over_time(0.50, sum(sum_over_time(apiserver_current_inflight_requests[1m]))[2h:1m])"
          requireSamples: false
        - name: inflight_1m_p90
          query: "quantile_over_time(0.90, sum(sum_over_time(apiserver_current_inflight_requests[1m]))[2h:1m])"
          requireSamples: false
        - name: inflight_1m_p99
          query: "quantile_over_time(0.99, sum(sum_over_time(apiserver_current_inflight_requests[1m]))[2h:1m])"
          requireSamples: false
        - name: inflight_1m_min
          query: "min_over_time(sum(sum_over_time(apiserver_current_inflight_requests[1m]))[2h:1m])"
          requireSamples: false
        - name: inflight_1m_avg
          query: "avg_over_time(sum(sum_over_time(apiserver_current_inflight_requests[1m]))[2h:1m])"
          requireSamples: false
        - name: inflight_1m_max
          query: "max_over_time(sum(sum_over_time(apiserver_current_inflight_requests[1m]))[2h:1m])"
          requireSamples: false
        - name: inflight_5m_p50
          query: "quantile_over_time(0.50, sum(sum_over_time(apiserver_current_inflight_requests[5m]))[2h:5m])"
          requireSamples: false
        - name: inflight_5m_p90
          query: "quantile_over_time(0.90, sum(sum_over_time(apiserver_current_inflight_requests[5m]))[2h:5m])"
          requireSamples: false
        - name: inflight_5m_p99
          query: "quantile_over_time(0.99, sum(sum_over_time(apiserver_current_inflight_requests[5m]))[2h:5m])"
          requireSamples: false
        - name: inflight_5m_min
          query: "min_over_time(sum(sum_over_time(apiserver_current_inflight_requests[5m]))[2h:5m])"
          requireSamples: false
        - name: inflight_5m_avg
          query: "avg_over_time(sum(sum_over_time(apiserver_current_inflight_requests[5m]))[2h:5m])"
          requireSamples: false
        - name: inflight_5m_max
          query: "max_over_time(sum(sum_over_time(apiserver_current_inflight_requests[5m]))[2h:5m])"
          requireSamples: false
