## Measurement module defines test scoped measurement.

## Input params
# Valid actions: "start", "gather"
{{$action := .action}}


steps:
- name: "{{$action}}ing measurements"
  measurements:
  - Identifier: EtcdMetrics Cluster Database Size
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: "EtcdMetrics"
      metricVersion: v1
      unit: bytes
      queries:
        - name: apiserver_storage_size_min
          query: "min_over_time(apiserver_storage_size_bytes[5m])"
          requireSamples: false
        - name: apiserver_storage_size_avg
          query: "avg_over_time(apiserver_storage_size_bytes[5m])"
          requireSamples: false
        - name: apiserver_storage_size_p50
          query: "quantile_over_time(0.50, apiserver_storage_size_bytes[5m])"
          requireSamples: false
        - name: apiserver_storage_size_p90
          query: "quantile_over_time(0.90, apiserver_storage_size_bytes[5m])"
          requireSamples: false
        - name: apiserver_storage_size_p99
          query: "quantile_over_time(0.99, apiserver_storage_size_bytes[5m])"
          requireSamples: false
        - name: apiserver_storage_size_max
          query: "max_over_time(apiserver_storage_size_bytes[5m])"
          requireSamples: false
- module:
    path: /prometheus/kube-apiserver.yaml
    params:
      action: {{$action}}
