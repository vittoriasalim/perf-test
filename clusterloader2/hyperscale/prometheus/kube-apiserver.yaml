# Module for collecting API server concurrency metrics with histograms
{{$action := .action}} # start, gather

- Identifier: APIServerConcurrencyHistogram
  Method: PrometheusSLO
  Params:
    action: {{$action}}
    summaryName: "APIServerConcurrencyHistogram"
    queries:
      # Histogram percentiles for inflight requests
      - name: inflight_p50
        query: "histogram_quantile(0.5, sum(rate(apiserver_current_inflight_requests[5m])) by (request_kind, le))"
      - name: inflight_p90
        query: "histogram_quantile(0.9, sum(rate(apiserver_current_inflight_requests[5m])) by (request_kind, le))"
      - name: inflight_p99
        query: "histogram_quantile(0.99, sum(rate(apiserver_current_inflight_requests[5m])) by (request_kind, le))"
      - name: inflight_max
        query: "max(apiserver_current_inflight_requests) by (request_kind)"
      - name: inflight_avg
        query: "avg(apiserver_current_inflight_requests) by (request_kind)"
        
- Identifier: FlowControlConcurrencyHistogram
  Method: PrometheusSLO
  Params:
    action: {{$action}}
    summaryName: "FlowControlConcurrencyHistogram"
    queries:
      # Flow control concurrency by priority level
      - name: flowcontrol_p50
        query: "histogram_quantile(0.5, sum(rate(apiserver_flowcontrol_request_concurrency_in_use[5m])) by (priority_level, le))"
      - name: flowcontrol_p90
        query: "histogram_quantile(0.9, sum(rate(apiserver_flowcontrol_request_concurrency_in_use[5m])) by (priority_level, le))"
      - name: flowcontrol_p99
        query: "histogram_quantile(0.99, sum(rate(apiserver_flowcontrol_request_concurrency_in_use[5m])) by (priority_level, le))"
      - name: flowcontrol_max
        query: "max(apiserver_flowcontrol_request_concurrency_in_use) by (priority_level)"
      - name: flowcontrol_avg
        query: "avg(apiserver_flowcontrol_request_concurrency_in_use) by (priority_level)"
